# Demo 3: Canary with steps – manual pause then timed steps.
# Progressive rollout: 20% → 40% → 60% → 80% → 100%
# Controller changes Service selectors (stable vs canary ReplicaSets).
# Promote: oc argo rollouts promote rollo-demo-3 -n argo-rollouts-demo-3
# Abort:   oc argo rollouts abort rollo-demo-3 -n argo-rollouts-demo-3
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: rollo-demo-3
  namespace: argo-rollouts-demo-3
spec:
  replicas: 5  # 5 replicas for clearer percentage splits (20% = 1 pod, 40% = 2 pods, etc.)
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: rollo-demo-3
  template:
    metadata:
      labels:
        app: rollo-demo-3
    spec:
      containers:
        - name: rollo
          image: quay.io/modzelewski/rollo:v1  # Change to v2 to trigger canary rollout
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: 32Mi
              cpu: 5m
  strategy:
    canary:
      # New version (canary) traffic goes to this service
      canaryService: rollo-demo-3-canary
      # Stable version traffic goes to this service
      stableService: rollo-demo-3-stable
      steps:
        # Step 1: 20% to canary (1 pod canary, 4 pods stable)
        - setWeight: 20
        # Manual pause: requires "oc argo rollouts promote" to continue
        - pause: {}

        # Step 2: 40% to canary (2 pods canary, 3 pods stable)
        - setWeight: 40
        # Automatic pause: advances after 10 seconds
        - pause:
            duration: 10

        # Step 3: 60% to canary (3 pods canary, 2 pods stable)
        - setWeight: 60
        - pause:
            duration: 10

        # Step 4: 80% to canary (4 pods canary, 1 pod stable)
        - setWeight: 80
        - pause:
            duration: 10

        # Final step: 100% (all 5 pods on new version) - implicit, no need to specify
