# Waypoint proxy for rollo-demo namespace (Service Mesh 3 ambient mode)
# This L7 proxy handles VirtualService routing
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: rollo-demo-waypoint
  namespace: rollo-demo
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
