# OpenShift Routes for Demo 3 (Canary with steps)
# Two routes, each 100% to one Service. The controller changes Service
# selectors (stable vs canary ReplicaSets). Route weights do not change
# and cannot follow 20→40→60→80 — that is demo4 (Service Mesh 3).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: rollo-demo-3-stable
  namespace: argo-rollouts-demo-3
  labels:
    app: rollo-demo-3
    service: stable
spec:
  to:
    kind: Service
    name: rollo-demo-3-stable
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: rollo-demo-3-canary
  namespace: argo-rollouts-demo-3
  labels:
    app: rollo-demo-3
    service: canary
spec:
  to:
    kind: Service
    name: rollo-demo-3-canary
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
