# OpenShift Route for Demo 3 (Canary with steps)
#
# Single Route with two backends: 80% to stable, 20% to canary.
# This gives actual ~20% of traffic to the canary during the first step.
# Argo Rollouts updates each service's selector to point at the right ReplicaSet
# (stableService → stable pods only, canaryService → canary pods only).
#
# For exact traffic control (not just replica-ratio), use Service Mesh (Istio).
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: rollo-demo-3
  namespace: rollo-demo
  labels:
    app: rollo-demo-3
spec:
  to:
    kind: Service
    name: rollo-demo-3-stable
    weight: 80
  alternateBackends:
    - kind: Service
      name: rollo-demo-3-canary
      weight: 20
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
