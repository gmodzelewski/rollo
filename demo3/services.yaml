# Demo 3: Canary – stable and canary services.
# The Rollout controller rewrites each Service selector to one ReplicaSet.
# Route weights are not used; each Route stays 100% to one Service (see routes.yaml).
apiVersion: v1
kind: Service
metadata:
  name: rollo-demo-3-stable
  namespace: argo-rollouts-demo-3
spec:
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: rollo-demo-3
---
apiVersion: v1
kind: Service
metadata:
  name: rollo-demo-3-canary
  namespace: argo-rollouts-demo-3
spec:
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: rollo-demo-3
