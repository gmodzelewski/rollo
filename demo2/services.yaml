# Demo 2: Blue-Green – active (production) and preview (new version only).
# Rollout controller will set selectors on these services.
apiVersion: v1
kind: Service
metadata:
  name: rollo-demo-2-active
  namespace: rollo-demo
spec:
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: rollo-demo-2
---
apiVersion: v1
kind: Service
metadata:
  name: rollo-demo-2-preview
  namespace: rollo-demo
spec:
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: rollo-demo-2
