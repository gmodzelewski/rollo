# Example Git Credentials Secret for Argo CD Image Updater
#
# Image Updater needs write access to your Git repository to commit changes.
# Choose ONE of the options below based on your Git provider setup.
#
# DO NOT apply this file directly - it's a template. Follow the instructions.

---
# Option 1: SSH Key (Recommended)
#
# 1. Generate SSH key:
#    ssh-keygen -t ed25519 -C "argocd-image-updater" -f ./image-updater-key
#
# 2. Add public key to your Git provider (GitHub/GitLab):
#    - GitHub: Settings → Deploy keys → Add (enable write access)
#    - GitLab: Settings → Repository → Deploy keys → Add (enable write access)
#
# 3. Create secret:
#    oc create secret generic git-creds \
#      --from-file=sshPrivateKey=./image-updater-key \
#      -n openshift-gitops
#
# 4. Reference in Application annotation:
#    argocd-image-updater.argoproj.io/write-back-target: "git:secret:openshift-gitops/git-creds"

---
# Option 2: Personal Access Token (HTTPS)
#
# 1. Create a Personal Access Token in your Git provider:
#    - GitHub: Settings → Developer settings → Personal access tokens → Generate new token
#      Scopes needed: repo (full control)
#    - GitLab: Settings → Access Tokens → Add personal access token
#      Scopes needed: write_repository
#
# 2. Create secret:
#    oc create secret generic git-creds \
#      --from-literal=username=YOUR-GIT-USERNAME \
#      --from-literal=password=YOUR-PERSONAL-ACCESS-TOKEN \
#      -n openshift-gitops
#
# 3. Reference in Application annotation:
#    argocd-image-updater.argoproj.io/write-back-target: "git:secret:openshift-gitops/git-creds"

---
# Option 3: Use Argo CD's Existing Repo Credentials
#
# If Argo CD already has credentials to your Git repo (for pulling),
# and those credentials have WRITE access, Image Updater can reuse them.
#
# No additional configuration needed - just ensure:
# 1. Argo CD can already pull from your repo
# 2. The credentials have write permission
# 3. Don't specify write-back-target annotation (it will use ArgoCD's credentials)

---
# Verification
#
# After configuring credentials, verify Image Updater can access Git:
#
# 1. Check Image Updater logs:
#    oc logs -n openshift-gitops deployment/argocd-image-updater -f
#
# 2. Look for messages like:
#    level=info msg="Committing 1 parameter update(s) for application rollo-demo-4"
#
# 3. If you see errors like "permission denied" or "authentication failed":
#    - Verify the secret exists: oc get secret git-creds -n openshift-gitops
#    - Check the secret has the right keys: oc describe secret git-creds -n openshift-gitops
#    - For SSH: Ensure the public key is added to your Git provider with write access
#    - For token: Ensure the token has repo/write_repository scope
