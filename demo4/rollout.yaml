# Demo 4: Canary with steps + Gateway API traffic routing (Service Mesh 3 ambient)
# Progressive rollout: 20% → 40% → 60% → 80% → 100%
# Exact HTTP percentages via HTTPRoute backend weights (Argo Rollouts plugin).
#
# Promote: oc argo rollouts promote rollo-demo-4 -n argo-rollouts-demo-4
# Abort:   oc argo rollouts abort rollo-demo-4 -n argo-rollouts-demo-4
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: rollo-demo-4
  namespace: argo-rollouts-demo-4
spec:
  replicas: 5  # traffic is controlled by HTTPRoute weights, not replica ratio
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: rollo-demo-4
  template:
    metadata:
      labels:
        app: rollo-demo-4
    spec:
      containers:
        - name: rollo
          image: quay.io/modzelewski/rollo:v1  # Change to v2 to trigger canary rollout
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: 32Mi
              cpu: 5m
  strategy:
    canary:
      canaryService: rollo-demo-4-canary
      stableService: rollo-demo-4-stable
      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            httpRoute: rollo-demo-4-split
      steps:
        - setWeight: 20
        - pause: {}
        - setWeight: 40
        - pause:
            duration: 10
        - setWeight: 60
        - pause:
            duration: 10
        - setWeight: 80
        - pause:
            duration: 10
